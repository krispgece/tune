[package]
name = "tune"
description = "Tune (working name): desktop app for SteelSeries devices on Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "tune_app"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde.workspace = true
# Default features minus `dbus` (taskbar badges only), which would need libdbus-1-dev to build.
tauri = { version = "2.12.6", default-features = false, features = [
    "wry",
    "compression",
    "common-controls-v6",
    "dynamic-acl",
    "x11",
] }
tune-core.workspace = true

[lints]
workspace = true
