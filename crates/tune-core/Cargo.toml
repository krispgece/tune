[package]
name = "tune-core"
description = "Device backends and settings store of the Tune desktop app (working name)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The device library (ssgg), pinned to a commit of the fork that adds the mouse features Tune needs, until they are in
# an upstream release. Only `adapter.rs` uses it.
steelseries-gg-linux = { git = "https://github.com/krispgece/steelseriesgg-rs", rev = "85f213ea411813c48ef789be1ad3338f190b339b" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "time"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
